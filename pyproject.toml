[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penfield_import"
version = "1.0.0"
description = "Import Obsidian vault notes to Penfield"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
penfield-import = "penfield_import:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["penfield_import", "penfield_auth"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
