[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penfield_import"
version = "2.0.1"
description = "Import Obsidian vault notes or Penfield export ZIPs into Penfield"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0", "markdown-it-py>=3,<4"]

[project.scripts]
penfield-import = "penfield_import:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["penfield_import", "penfield_auth", "penfield_io"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
